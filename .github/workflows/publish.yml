# Publish a GitHub Release to the Marketplace and Open VSX.
#
# Runs only when a full release is published (not a draft or prerelease).
# Both registries must trust this file before the first run can succeed:
#   Marketplace: trusted publishing for spufidoo/vscode-3270, workflow publish.yml
#   Open VSX:    trusted publisher for the same owner, repo, and filename,
#                with the environment left blank

name: Publish

on:
  release:
    types: [released]

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci

      - name: Require the release tag to match package.json
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "v$version" ]; then
            echo "Release tag $tag does not match package.json version v$version"
            exit 1
          fi

      - name: Package, including vendored tnz and ebcdic
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-3270-*.vsix
          if-no-files-found: error

      - name: Attach the package to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" vscode-3270-*.vsix --clobber

  marketplace:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix --oidc

  open-vsx:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to Open VSX
        run: npx --yes ovsx publish --packagePath dist/*.vsix --trusted-publishing
